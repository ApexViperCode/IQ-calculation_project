<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IQ calculation</title>
    <style>
        body{
             height: 100vh;
             width: 100%;
            background: linear-gradient(to top, #032681, #000000);  
        }
        .Question{

          display: flex;
         flex-direction: column;
          align-items: center;    
          gap: 15px;
          direction: rtl;
        }
            .row {
            display: flex;
            flex-direction: row;      
            justify-content: center;  
            align-items: center;
            gap: 40px; 
            margin-top: 25px;   
            direction: rtl;         
        }
        .b{
            color: #000000;
            border-radius: 20px;
            background:#fdfeff;
            box-shadow: 0 0 19px rgba(5, 28, 231, 0.967);
            
           margin-top: 80px;
            height: 50px;
            width: 1000px;
            font-size: 25px; 
            border: none;      
          
        }
        .i1, .i2 {
         background: #fff;
         color: black;
         height: 40px;
         width: 470px;
         border-radius: 20px;
         border: none;
         cursor: pointer;
   
        }
        .i1:hover,.i2:hover {
            box-shadow: 0 0 19px rgba(5, 28, 231, 0.967);
        }
        .numbers{
          margin-top: 400px;
        }
        .n1,.n2,.n3,.n4,.n5,.n6,.n7,.n8,.n9,.n10,.n11,.n12,.n13,.n14,.n15,.n16,.n17,.n18,.n19,.n20{
              border: none;
          
          height: 35px;
          width: 35px;
        border-radius: 5px;
        background: #000000;
        color: #fff;
        cursor: pointer;
          
        }
        .n1,.n2:hover,.n3:hover,.n4:hover,.n5:hover,.n6:hover,.n7:hover,.n8:hover,.n9:hover,.n10:hover,.n11:hover,.n12:hover,.n13:hover,.n14:hover,.n15:hover,.n16:hover,.n17:hover,.n18:hover,.n19:hover,.n20:hover{
            box-shadow: 0 0 9px rgba(251, 251, 253, 0.967);
        }
    </style>
</head>
<body>
    
        <div class="Question">
        <button class="b" type="text">ما هو الرقم التالي في النمط المعقد الآتي: 3، 5، 9، 17، 33، ...؟</button>
        </div>
        <br>
        <br>

<div class="row">
