<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> IQ Result</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; color: #f3f0f0; font-family: sans-serif; }
        body { min-height: 100vh; width: 100%; background: linear-gradient(to top, #032681, #000000);    display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
        .result-container { width: 100%; max-width: 900px; }
        .score-card { background: rgba(0, 0, 0, 0.6); border: 2px solid #38bdf8; border-radius: 20px; padding: 30px; text-align: center; box-shadow: 0 0 25px rgba(56, 189, 248, 0.4); margin-bottom: 40px; }
        .score-card h2 { font-size: 28px; margin-bottom: 10px; }
        .iq-score { font-size: 70px; color: #38bdf8; text-shadow: 0 0 20px #38bdf8; font-weight: bold; margin: 10px 0; }
        .iq-status { font-size: 22px; color: #fff; margin-bottom: 15px; }
        .score-details { font-size: 18px; color: #ccc; }
        .report-section { width: 100%; }
        .report-title { font-size: 26px; margin-bottom: 25px; border-bottom: 2px solid #38bdf8; padding-bottom: 10px; text-align: center; }
        .question-card { background: rgba(255, 255, 255, 0.05); border-radius: 15px; padding: 20px; margin-bottom: 20px; border-right: 6px solid #ccc; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .question-card.correct { border-right-color: #28a745; }
        .question-card.incorrect { border-right-color: #dc3545; }
        .q-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .q-number { font-size: 18px; font-weight: bold; color: #38bdf8; }
        .badge { padding: 5px 12px; border-radius: 20px; font-size: 14px; font-weight: bold; }
        .badge.correct { background-color: #28a745; color: #fff; }
        .badge.incorrect { background-color: #dc3545; color: #fff; }
        .q-text { font-size: 19px; margin-bottom: 15px; font-weight: bold; }
        .ans-box { font-size: 16px; margin: 6px 0; padding: 8px 12px; border-radius: 8px; background: rgba(0, 0, 0, 0.3); }
        .user-ans.wrong span { color: #ff6b6b; font-weight: bold; }
        .user-ans.right span { color: #51cf66; font-weight: bold; }
        .correct-ans span { color: #51cf66; font-weight: bold; }
        .explanation { margin-top: 12px; padding: 12px; background: rgba(3, 38, 129, 0.4); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 8px; font-size: 15px; line-height: 1.6; color: #e0e0e0; }
        .explanation strong { color: #38bdf8; }
        .button { background-color: rgb(6, 38, 218); color: white; border: none; height: 50px; border-radius: 50px; width: 100%; max-width: 400px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 20px; }
        .button:hover { box-shadow: 0 0 19px rgba(5, 28, 231, 0.967); }
        body{
            background: #000000;
        }
         .questions-report:hover{
            box-shadow: 0 0 19px #032681 ;
           
         }
    </style>
</head>
<body>

    <div class="result-container">
        <div class="score-card">
            <h2>نتيجة اختبار الذكاء (IQ Calculation)</h2>
            <div class="iq-score" id="iq-value">--</div>
            <div class="iq-status" id="iq-status">--</div>
            <p class="score-details" id="score-details">جاري حساب النتيجة...</p>
        </div>

        <div class="report-section">
            <h3 class="report-title">تقرير الإجابات والتحليل التفصيلي للأخطاء</h3>
            <div id="questions-report"></div>
        </div>

        <center>
            <button class="button" onclick="restartTest()">إعادة الاختبار من الجديد</button>
        </center>
    </div>

    <script>
       // مصفوفة الأسئلة الـ 20 كاملة مع الإجابات الصحيحة وترتيب الخيار الصحيح والشرح
const questionsData = [
    {
        question: "1. رجل عمره الآن 3 أضعاف عمر ابنه. بعد 15 سنة، سيصبح عمر الأب ضعف عمر الابن. كم عمر الأب الآن؟",
        options: ["30 سنة", "45 سنة", "50 سنة", "60 سنة"],
        correctIndex: 1, // الفهرس 1 يعني الخيار الثاني "45 سنة"
        explanation: "إذا كان عمر الابن الآن x، فإن عمر الأب 3x. بعد 15 سنة: (3x + 15) = 2(x + 15) ⇒ 3x + 15 = 2x + 30 ⇒ x = 15. إذن عمر الأب الآن = 3 × 15 = 45 سنة."
    },
    {
        question: "2. ما هو الرقم التالي في المتتابعة: 2, 6, 12, 20, 30, ...؟",
        options: ["36", "40", "42", "48"],
        correctIndex: 2, // الفهرس 2 يعني "42"
        explanation: "النمط يعتمد على إضافة أعداد زوجية متتالية: +4, +6, +8, +10. الرقم التالي يتم بإضافة +12 إلى 30 ليصبح الناتج 42."
    },
    {
        question: "3. إذا كان اليوم الذي يسبق أمس هو الأربعاء، فما هو اليوم الحالي؟",
        options: ["الخميس", "الجمعة", "السبت", "الأحد"],
        correctIndex: 1, // "الجمعة"
        explanation: "اليوم الذي يسبق أمس = الأربعاء ⇒ أمس = الخميس ⇒ اليوم = الجمعة."
    },
    {
        question: "4. عندما تشير الساعة إلى 3:15، ما هي الزاوية الصغرى بين عقرب الساعات وعقرب الدقائق؟",
        options: ["0°", "7.5°", "15°", "30°"],
        correctIndex: 1, // "7.5°"
        explanation: "عقرب الدقائق عند الرقم 3 بالضبط (90°). عقرب الساعات يتحرك بمقدار 0.5° في الدقيقة، فخلال 15 دقيقة يتحرك 15 × 0.5 = 7.5° بعيداً عن الرقم 3."
    },
    {
        question: "5. لديك 9 كرات متطابقة، إحداها أثقل قليلاً. ما هو أقل عدد من وزنات الميزان لمعرفة الكرة الثقيلة؟",
        options: ["1", "2", "3", "4"],
        correctIndex: 1, // "2"
        explanation: "تقسم الكرات إلى 3 مجموعات (3, 3, 3). الوزنة الأولى تحدد المجموعة الثقيلة، والوزنة الثانية تقارن بين كرتين منها."
    },
    {
        question: "6. صندوق يحتوي على 3 كرات حمراء و2 خضراء. ما احتمال سحب كرتين حمراوين بدون إرجاع؟",
        options: ["1/5", "3/10", "2/5", "1/2"],
        correctIndex: 1, // "3/10"
        explanation: "احتمال الأولى = 3/5، الثانية = 2/4. الاحتمال الكلي = (3/5) × (2/4) = 6/20 = 3/10."
    },
    {
        question: "7. قطار طوله 100 متر يسير بسرعة 72 كم/ساعة. كم ثانية يستغرق ليعبر جسراً طوله 200 متر؟",
        options: ["10 ثوانٍ", "12 ثانية", "15 ثانية", "20 ثانية"],
        correctIndex: 2, // "15 ثانية"
        explanation: "السرعة بـ (م/ث) = 72 × (5/18) = 20 م/ث. المسافة الكلية = 100 + 200 = 300 متر. الزمن = 300 / 20 = 15 ثانية."
    },
    {
        question: "8. عدد إذا أضفت إليه نصفه ثم ربعـه أصبح الناتج 28، فما هو العدد؟",
        options: ["12", "16", "20", "24"],
        correctIndex: 1, // "16"
        explanation: "x + 0.5x + 0.25x = 28 ⇒ 1.75x = 28 ⇒ x = 28 / 1.75 = 16."
    },
    {
        question: "9. إذا كان أحمد أطول من علي، وعلي أطول من سعيد، وسعيد أقصر من خالد وخالد أطول من أحمد. من الأطول؟",
        options: ["أحمد", "علي", "سعيد", "خالد"],
        correctIndex: 3, // "خالد"
        explanation: "الترتيب من الأطول: خالد > أحمد > علي > سعيد. إذاً خالد هو الأطول."
    },
    {
        question: "10. أنبوب يملأ الخزان في 2 ساعة، والثاني في 3 ساعات. كم يستغرق ملء الخزان إذا فتحا معاً؟",
        options: ["ساعة واحدة", "ساعة و 12 دقيقة", "ساعة و 30 دقيقة", "ساعتان"],
        correctIndex: 1, // "ساعة و 12 دقيقة"
        explanation: "المعدل الكلي = (1/2) + (1/3) = 5/6. الزمن = 6/5 ساعة = 1.2 ساعة = ساعة و 12 دقيقة."
    },
    {
        question: "11. ما هو الرقم التالي في النمط المعقد الآتي: 3، 5، 9، 17، 33، ...؟",
        options: ["49", "65", "61", "55"],
        correctIndex: 1, // "65"
        explanation: "مقدار الزيادة يتضاعف (+2, +4, +8, +16). الزيادة التالية +32، إذاً 33 + 32 = 65."
    },
    {
        question: "12. إذا استغرق بناء سور 6 أيام بمساعدة 6 عمال، فكم يوماً يحتاجه عامل واحد فقط لبناء نفس السور؟",
        options: ["12 يوماً", "24 يوماً", "36 يوماً", "48 يوماً"],
        correctIndex: 2, // "36 يوماً"
        explanation: "إجمالي الجهد = 6 عمال × 6 أيام = 36 يوم-عامل. إذاً العامل الواحد يحتاج 36 يوماً."
    },
    {
        question: "13. إذا كانت 5 قطط تستطيع اصطياد 5 فيران في 5 دقائق، فكم دقيقة تحتاج قطة واحدة لاصطياد فأر واحد؟",
        options: ["1 دقيقة", "5 دقائق", "10 دقائق", "25 دقيقة"],
        correctIndex: 1, // "5 دقائق"
        explanation: "كل قطة تحتاج 5 دقائق كاملة لاصطياد فأرها."
    },
    {
        question: "14. ما هو الكسر الأكبر قيمة بين الكسور الآتية؟",
        options: ["3/4", "7/9", "4/5", "5/6"],
        correctIndex: 3, // "5/6"
        explanation: "بالتحويل لعشري: 3/4=0.75, 7/9=0.777, 4/5=0.80, 5/6=0.833. القيمة الأكبر هي 5/6."
    },
    {
        question: "15. إذا كان 'أ' أطول من 'ب'، و'ب' أطول من 'ج'، و'د' أطول من 'أ'، فمن هو الأقصر بينهم؟",
        options: ["أ", "ب", "ج", "د"],
        correctIndex: 2, // "ج"
        explanation: "التسلسل: د > أ > ب > ج. الشخص الأقصر هو 'ج'."
    },
    {
        question: "16. إذا قمت بضرب جميع الأعداد الموجودة على لوحة الهاتف (من 0 إلى 9)، فما هي النتيجة النهائية؟",
        options: ["0", "362880", "40320", "1"],
        correctIndex: 0, // "0"
        explanation: "لوحة الهاتف تحوي الرقم (0)، وأي عدد يضرب في صفر يكون الناتج صفراً دائماً."
    },
    {
        question: "17. ما هو الشيء الذي يوجد في منتصف 'باريس'؟",
        options: ["متحف اللوفر", "حرف الـ (ر)", "برج إيفل", "نهر السين"],
        correctIndex: 1, // "حرف الـ (ر)"
        explanation: "لغز لغوي: الحرف الأوسط في كلمة (ب ا ر ي س) هو حرف الراء (ر)."
    },
    {
        question: "18. أربعة إخوة بنوا منزلاً، الأول دفع نصف ثمنه، والثاني دفع ربع الثمن، والثالث دفع ثمن المنزل (1/8)، والرابع دفع باقي المبلغ وقدره 10 آلاف دولار. فما هو الثمن الإجمالي للمنزل؟",
        options: ["40 ألف دولار", "60 ألف دولار", "100 ألف دولار", "80 ألف دولار"],
        correctIndex: 3, // "80 ألف دولار"
        explanation: "مجموع ما دفعه الثلاثة الأول = 1/2 + 1/4 + 1/8 = 7/8. الباقي للأخ الرابع (1/8) = 10,000$، إذاً السعر الإجمالي = 80,000$."
    },
    {
        question: "19. كم مرة ينطبق عقرب الساعات وعقرب الدقائق على بعضهما البعض خلال 24 ساعة كاملة؟",
        options: ["48 مرة", "24 مرة", "12 مرة", "22 مرة"],
        correctIndex: 3, // "22 مرة"
        explanation: "ينطبق العقربان 11 مرة كل 12 ساعة، أي 22 مرة خلال 24 ساعة كاملة."
    },
    {
        question: "20. إذا كانت الساعة تشير إلى الساعة الثانية عشرة وخمس عشرة دقيقة (12:15)، فما هي الزاوية الصغرى بين عقرب الساعات وعقرب الدقائق؟",
        options: ["0 درجة", "7.5 درجة", "22.5 درجة", "90 درجة"],
        correctIndex: 1, // "7.5 درجة" (أو حسب خياراتك المحددة في السؤال الأخير، تأكد من مطابقة الفهرس للخيار الصحيح)
        explanation: "عقرب الدقائق عند 90°. عقرب الساعات يتحرك 0.5° لكل دقيقة، ففي 15 دقيقة تتحرك 7.5° بعيداً عن الـ 12/3."
    }
];

function generateReport() {
    let correctCount = 0;
    const container = document.getElementById('questions-report');
    if (!container) return;
    container.innerHTML = '';

    questionsData.forEach((q, index) => {
        // قراءة الإجابة المخزنة من المتصفح لكل سؤال من 1 إلى 20
        const savedAnswer = localStorage.getItem('user_ans_' + (index + 1));
        const userIndex = savedAnswer !== null ? parseInt(savedAnswer) : null;
        
        const isCorrect = userIndex === q.correctIndex;
        if (isCorrect) correctCount++;

        const userAnsText = userIndex !== null ? q.options[userIndex] : "لم تجب على السؤال";
        const correctAnsText = q.options[q.correctIndex];

        const card = document.createElement('div');
        card.className = `question-card ${isCorrect ? 'correct' : 'incorrect'}`;
        card.innerHTML = `
            <div class="q-header">
                <span class="q-number">السؤال ${index + 1}</span>
                <span class="badge ${isCorrect ? 'correct' : 'incorrect'}">
                    ${isCorrect ? 'إجابة صحيحة ✓' : 'إجابة خاطئة ✗'}
                </span>
            </div>
            <div class="q-text">${q.question}</div>
            <div class="ans-box user-ans ${isCorrect ? 'right' : 'wrong'}">
                إجابتك: <span>${userAnsText}</span>
            </div>
            ${!isCorrect ? `
            <div class="ans-box correct-ans">
                الإجابة الصحيحة: <span>${correctAnsText}</span>
            </div>
            ` : ''}
            <div class="explanation">
                <strong>لماذا هذه هي الإجابة؟ (الشرح والتحليل):</strong><br>
                ${q.explanation}
            </div>
        `;
        container.appendChild(card);
    });

    // حساب درجة IQ تقريبية ومعيارية بناءً على الإجابات الصحيحة
    let iqScore = 70 + Math.round((correctCount / 20) * 60);
    let percentage = Math.round((correctCount / 20) * 100);

    const iqValElem = document.getElementById('iq-value');
    const scoreDetailsElem = document.getElementById('score-details');
    const iqStatusElem = document.getElementById('iq-status');

    if (iqValElem) iqValElem.innerText = iqScore;
    if (scoreDetailsElem) scoreDetailsElem.innerText = `أجبت على ${correctCount} سؤالاً صحيحاً من أصل 20 (النسبة: ${percentage}%)`;

    let status = "";
    if (iqScore >= 125) status = "مستوى ذكاء خارق (عبقري)";
    else if (iqScore >= 110) status = "مستوى ذكاء مرتفع (فوق المتوسط)";
    else if (iqScore >= 90) status = "مستوى ذكاء متوسط (طبيعي)";
    else status = "يحتاج إلى تطوير مهارات التفكير والمنطق";
    
    if (iqStatusElem) iqStatusElem.innerText = status;
}




        function generateReport() {
            let correctCount = 0;
            const container = document.getElementById('questions-report');
            container.innerHTML = '';

            questionsData.forEach((q, index) => {
                const savedAnswer = localStorage.getItem('user_ans_' + (index + 1));
                const userIndex = savedAnswer !== null ? parseInt(savedAnswer) : null;
                const isCorrect = userIndex === q.correctIndex;
                if (isCorrect) correctCount++;

                const userAnsText = userIndex !== null ? q.options[userIndex] : "لم تجب على السؤال";
                const correctAnsText = q.options[q.correctIndex];

                const card = document.createElement('div');
                card.className = `question-card ${isCorrect ? 'correct' : 'incorrect'}`;
                card.innerHTML = `
                    <div class="q-header">
                        <span class="q-number">السؤال ${index + 1}</span>
                        <span class="badge ${isCorrect ? 'correct' : 'incorrect'}">
                            ${isCorrect ? 'إجابة صحيحة ✓' : 'إجابة خاطئة ✗'}
                        </span>
                    </div>
                    <div class="q-text">${q.question}</div>
                    <div class="ans-box user-ans ${isCorrect ? 'right' : 'wrong'}">إجابتك: <span>${userAnsText}</span></div>
                    ${!isCorrect ? `<div class="ans-box correct-ans">الإجابة الصحيحة: <span>${correctAnsText}</span></div>` : ''}
                    <div class="explanation"><strong>التفسير والتحليل:</strong> ${q.explanation}</div>
                `;
                container.appendChild(card);
            });

            let iqScore = 70 + Math.round((correctCount / 20) * 60);
            let percentage = Math.round((correctCount / 20) * 100);

            document.getElementById('iq-value').innerText = iqScore;
            document.getElementById('score-details').innerText = `أجبت على ${correctCount} سؤالاً صحيحاً من أصل 20 (النسبة: ${percentage}%)`;

            let status = "";
            if (iqScore >= 125) status = "مستوى ذكاء خارق (عبقري)";
            else if (iqScore >= 110) status = "مستوى ذكاء مرتفع (فوق المتوسط)";
            else if (iqScore >= 90) status = "مستوى ذكاء متوسط (طبيعي)";
            else status = "يحتاج إلى تطوير مهارات التفكير المنطقي";
            
            document.getElementById('iq-status').innerText = status;
        }

        function restartTest() {
            localStorage.clear();
            window.location.href = "Question/Question1.html";
        }

        window.onload = generateReport;
    </script>
</body>
</html>
